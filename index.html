<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Dashboard - Tiket Bus</title>
  <style>
    body { font-family: Arial; background:#f9fafb; margin:0; padding:20px; }
    .card { background:#fff; padding:20px; border-radius:8px; max-width:900px; margin:20px auto; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-bottom:10px; }
    table { width:100%; border-collapse:collapse; margin-top:15px; }
    th, td { border:1px solid #ddd; padding:10px; text-align:center; }
    th { background:#007bff; color:#fff; }
    tr:nth-child(even) { background:#f2f2f2; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; }
    button { padding:8px 12px; border:none; border-radius:5px; cursor:pointer; }
    .btn-logout { background:#dc3545; color:#fff; font-weight:bold; }
    .btn-pesan { background:#28a745; color:#fff; }
    .btn-hapus { background:#dc3545; color:#fff; }
    .btn-clear { background:#ff9800; color:#fff; margin-top:10px; }
    .btn-cetak { background:#007bff; color:#fff; }
    #formPesan { display:none; margin-top:20px; padding:15px; border:1px solid #ddd; border-radius:8px; background:#f1f1f1; }
    input { padding:8px; width:100%; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <h2>Dashboard Tiket Bus</h2>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
    <p id="welcome"></p>

    <h3>Jadwal Bus Hari Ini</h3>
    <table>
      <thead>
        <tr>
          <th>Rute</th>
          <th>Jam Berangkat</th>
          <th>Jam Tiba</th>
          <th>Harga</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="schedule-body"></tbody>
    </table>

    <!-- Form Pemesanan -->
    <div id="formPesan">
      <h3>Form Pemesanan Tiket</h3>
      <p id="pilihanRute"></p>
      <input type="text" id="namaPenumpang" placeholder="Nama Penumpang">
      <input type="number" id="jumlahTiket" placeholder="Jumlah Tiket" min="1" value="1">
      <button class="btn-pesan" onclick="simpanPesanan()">Simpan Pesanan</button>
      <button onclick="batalPesan()">Batal</button>
    </div>

    <h3>Daftar Pesanan Saya</h3>
    <table>
      <thead>
        <tr>
          <th>Nama Penumpang</th>
          <th>Rute</th>
          <th>Jumlah Tiket</th>
          <th>Total Harga</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="pesanan-body"></tbody>
    </table>
    <button class="btn-clear" onclick="hapusSemuaPesanan()">Hapus Semua Pesanan</button>
  </div>

  <script>
    const schedules = [
      { rute: "Jakarta - Bandung", berangkat: "08:00", tiba: "11:00", harga: 120000 },
      { rute: "Bandung - Yogyakarta", berangkat: "09:30", tiba: "16:00", harga: 250000 },
      { rute: "Jakarta - Semarang", berangkat: "10:00", tiba: "15:30", harga: 300000 },
      { rute: "Yogyakarta - Surabaya", berangkat: "12:00", tiba: "17:00", harga: 200000 }
    ];

    let pesananDipilih = null;

    const user = localStorage.getItem("loggedInUser");
    if (!user) {
      alert("Anda harus login dulu!");
      window.location.href = "login.html";
    } else {
      document.getElementById("welcome").textContent = "Halo, " + user + " 👋";
    }

    const tbody = document.getElementById("schedule-body");
    schedules.forEach((s, i) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${s.rute}</td>
        <td>${s.berangkat}</td>
        <td>${s.tiba}</td>
        <td>Rp ${s.harga.toLocaleString()}</td>
        <td><button class="btn-pesan" onclick="pesan(${i})">Pesan</button></td>
      `;
      tbody.appendChild(row);
    });

    function pesan(i) {
      pesananDipilih = schedules[i];
      document.getElementById("pilihanRute").textContent = 
        `Rute: ${pesananDipilih.rute} | Harga per tiket: Rp ${pesananDipilih.harga.toLocaleString()}`;
      document.getElementById("formPesan").style.display = "block";
    }

    function batalPesan() {
      pesananDipilih = null;
      document.getElementById("formPesan").style.display = "none";
    }

    function simpanPesanan() {
      const nama = document.getElementById("namaPenumpang").value;
      const jumlah = parseInt(document.getElementById("jumlahTiket").value);

      if (!nama || jumlah < 1 || !pesananDipilih) {
        alert("Lengkapi data pemesanan!");
        return;
      }

      const total = pesananDipilih.harga * jumlah;
      let pesanan = JSON.parse(localStorage.getItem("pesanan")) || [];
      pesanan.push({ nama, rute: pesananDipilih.rute, jumlah, total });
      localStorage.setItem("pesanan", JSON.stringify(pesanan));

      alert("Pesanan berhasil disimpan!");
      tampilkanPesanan();
      batalPesan();
    }

    function tampilkanPesanan() {
      const tbody = document.getElementById("pesanan-body");
      tbody.innerHTML = "";
      let pesanan = JSON.parse(localStorage.getItem("pesanan")) || [];
      pesanan.forEach((p, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${p.nama}</td>
          <td>${p.rute}</td>
          <td>${p.jumlah}</td>
          <td>Rp ${p.total.toLocaleString()}</td>
          <td>
            <button class="btn-cetak" onclick="cetakStruk(${index})">Cetak Struk</button>
            <button class="btn-hapus" onclick="hapusPesanan(${index})">Hapus</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function hapusPesanan(index) {
      let pesanan = JSON.parse(localStorage.getItem("pesanan")) || [];
      if (confirm("Yakin ingin menghapus pesanan ini?")) {
        pesanan.splice(index, 1);
        localStorage.setItem("pesanan", JSON.stringify(pesanan));
        tampilkanPesanan();
      }
    }

    function hapusSemuaPesanan() {
      if (confirm("Yakin ingin menghapus SEMUA pesanan?")) {
        localStorage.removeItem("pesanan");
        tampilkanPesanan();
      }
    }

    // Cetak struk tiket
    function cetakStruk(index) {
      let pesanan = JSON.parse(localStorage.getItem("pesanan")) || [];
      const p = pesanan[index];

      const struk = `
        ===== STRUK TIKET BUS =====
        Nama Penumpang : ${p.nama}
        Rute           : ${p.rute}
        Jumlah Tiket   : ${p.jumlah}
        Total Bayar    : Rp ${p.total.toLocaleString()}
        ===========================
        Dicetak pada   : ${new Date().toLocaleString()}
      `;

      // Buka window baru untuk print
      const win = window.open("", "Cetak Struk", "width=400,height=400");
      win.document.write(`<pre>${struk}</pre>`);
      win.document.close();
      win.print();
    }

    tampilkanPesanan();

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    }
  </script>
</body>
<script>
  // ... fungsi login, pesan, batal, simpanPesanan, tampilkanPesanan, hapusPesanan, hapusSemuaPesanan tetap sama ...

  // Cetak struk profesional
  function cetakStruk(index) {
    let pesanan = JSON.parse(localStorage.getItem("pesanan")) || [];
    const p = pesanan[index];

    // Generate QR Code (isi QR = nama+rute+timestamp)
    const qrData = encodeURIComponent(`${p.nama} | ${p.rute} | ${Date.now()}`);
    const qrUrl = `https://chart.googleapis.com/chart?cht=qr&chs=150x150&chl=${qrData}`;

    // Template struk
    const strukHTML = `
      <html>
      <head>
        <title>Struk Tiket Bus</title>
        <style>
          body { font-family: Arial, sans-serif; padding:20px; }
          .ticket { border:2px dashed #007bff; padding:20px; border-radius:10px; max-width:400px; margin:auto; }
          .header { text-align:center; margin-bottom:20px; }
          .logo { font-size:24px; font-weight:bold; color:#007bff; }
          table { width:100%; border-collapse:collapse; margin-top:10px; }
          td { padding:6px; }
          .qr { text-align:center; margin-top:20px; }
          .footer { text-align:center; margin-top:15px; font-size:12px; color:#666; }
        </style>
      </head>
      <body>
        <div class="ticket">
          <div class="header">
            <div class="logo">🚌 Gumarang Jaya</div>
            <div><strong>Struk Tiket Bus</strong></div>
          </div>
          <table>
            <tr><td>Nama Penumpang</td><td>: ${p.nama}</td></tr>
            <tr><td>Rute</td><td>: ${p.rute}</td></tr>
            <tr><td>Jumlah Tiket</td><td>: ${p.jumlah}</td></tr>
            <tr><td>Total Bayar</td><td>: Rp ${p.total.toLocaleString()}</td></tr>
            <tr><td>Tanggal Cetak</td><td>: ${new Date().toLocaleString()}</td></tr>
          </table>
          <div class="qr">
            <img src="${qrUrl}" alt="QR Code Tiket">
            <div style="font-size:12px;color:#555;">Scan untuk validasi tiket</div>
          </div>
          <div class="footer">
            Terima kasih telah menggunakan layanan <b>Gumarang Jaya</b>.<br>
            Selamat menikmati perjalanan Anda 🚍
          </div>
        </div>
      </body>
      </html>
    `;

    const win = window.open("", "Cetak Struk", "width=450,height=600");
    win.document.write(strukHTML);
    win.document.close();
    win.print();
  }

  // ... fungsi logout tetap sama ...
</script>
</html>
