<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Register - Tiket Bus</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; display:flex; height:100vh; justify-content:center; align-items:center; }
    .card { background:#fff; padding:20px; border-radius:8px; width:300px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
    button { width:100%; padding:10px; border:none; border-radius:5px; background:#007bff; color:#fff; font-weight:bold; cursor:pointer; }
    a { font-size:0.9em; display:block; margin-top:10px; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Daftar Akun</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="register()">Daftar</button>
    <a href="login.html">Sudah punya akun? Login</a>
  </div>

  <script>
    function register() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        alert("Isi semua field!");
        return;
      }

      let users = JSON.parse(localStorage.getItem("users")) || [];

      // cek apakah username sudah ada
      if (users.find(u => u.username === username)) {
        alert("Username sudah terdaftar!");
        return;
      }

      users.push({ username, password });
      localStorage.setItem("users", JSON.stringify(users));

      alert("Registrasi berhasil! Silakan login.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
